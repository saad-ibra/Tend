<script>
  // Interactive habit toggles
  (function initHabits() {
    const habitCards = document.querySelectorAll('.habit-card');
    const progressBar = document.getElementById('habit-progress-bar');
    const progressText = document.getElementById('habit-progress-text');

    function updateProgress() {
      const total = habitCards.length;
      let completed = 0;

      habitCards.forEach(card => {
        if (card.getAttribute('data-checked') === 'true') {
          completed++;
        }
      });

      const pct = Math.round((completed / total) * 100);
      if (progressBar) progressBar.style.width = pct + '%';
      if (progressText) progressText.textContent = `${completed} of ${total} done`;
    }

    habitCards.forEach(card => {
      card.addEventListener('click', (e) => {
        const isChecked = card.getAttribute('data-checked') === 'true';
        const newChecked = !isChecked;
        card.setAttribute('data-checked', String(newChecked));

        const box = card.querySelector('.check-box');
        const title = card.querySelector('.habit-title');

        if (newChecked) {
          box.classList.remove('bg-surface-container-highest', 'text-transparent');
          box.classList.add('bg-primary-container', 'text-on-primary');
          title.classList.add('line-through', 'text-outline');
          title.classList.remove('text-on-surface');
        } else {
          box.classList.add('bg-surface-container-highest', 'text-transparent');
          box.classList.remove('bg-primary-container', 'text-on-primary');
          title.classList.remove('line-through', 'text-outline');
          title.classList.add('text-on-surface');
        }

        updateProgress();
      });
    });

    // Quick Voice Feedback
    const audioBtn = document.getElementById('audio-record-btn');
    if (audioBtn) {
      let recording = false;
      audioBtn.addEventListener('click', () => {
        recording = !recording;
        if (recording) {
          audioBtn.classList.add('bg-error-container', 'text-on-error-container');
        } else {
          audioBtn.classList.remove('bg-error-container', 'text-on-error-container');
        }
      });
    }
  })();
